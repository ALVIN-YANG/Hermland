<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Hermland: both Macs initiate SSH connections to your VPS</title>
  <desc id="desc">The client Mac and the home Mac each initiate an SSH tunnel to your VPS. Arrows show initiation, not message direction. Traffic is bidirectional. Public keys need manual approval, and the server key is pinned. The original agent stays at home. Trust the VPS administrator: this is not end-to-end encryption.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e6b61" stroke-width="2"/></marker></defs>
  <rect width="1200" height="560" rx="22" fill="#f5f7f4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#172b39">
    <text x="56" y="68" font-size="36" font-weight="700">Your agent stays home. Your access comes along.</text>
    <text x="56" y="110" font-size="23" fill="#50636d">Two SSH tunnels · Original WebUI · No inbound port on your home router</text>
    <g id="client">
      <rect x="56" y="166" width="300" height="210" rx="16" fill="#fff" stroke="#ccd7d3" stroke-width="2"/>
      <text x="82" y="208" font-size="27" font-weight="700">Client Mac</text>
      <text x="82" y="247" font-size="24">Hermland</text>
      <text x="82" y="295" font-size="21" fill="#50636d">Private key in Keychain</text>
      <text x="82" y="334" font-size="21" fill="#50636d">Web port: loopback only</text>
    </g>
    <g id="relay">
      <rect x="450" y="166" width="300" height="210" rx="16" fill="#e4eeea" stroke="#a9c0b8" stroke-width="2"/>
      <text x="476" y="208" font-size="27" font-weight="700">Your VPS</text>
      <text x="476" y="247" font-size="24">SSH relay</text>
      <text x="476" y="295" font-size="21" fill="#50636d">Manual public-key approval</text>
      <text x="476" y="334" font-size="21" fill="#50636d">Relay port: loopback only</text>
    </g>
    <g id="home">
      <rect x="844" y="166" width="300" height="210" rx="16" fill="#fff" stroke="#ccd7d3" stroke-width="2"/>
      <text x="870" y="208" font-size="27" font-weight="700">Home Mac</text>
      <text x="870" y="247" font-size="24">Hermes / OpenClaw</text>
      <text x="870" y="295" font-size="21" fill="#50636d">Models, memory, chats</text>
      <text x="870" y="334" font-size="21" fill="#50636d">Online, logged in, awake</text>
    </g>
    <path d="M370 255 H432" stroke="#2e6b61" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M830 255 H768" stroke="#2e6b61" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="402" y="228" font-size="20" text-anchor="middle" fill="#2e6b61">SSH</text>
    <text x="798" y="228" font-size="20" text-anchor="middle" fill="#2e6b61">SSH</text>
    <text x="56" y="424" font-size="23">Arrows show who connects. Messages flow both ways; SSH carries the WebUI.</text>
    <path d="M56 453 H1144" stroke="#ccd7d3"/>
    <text x="56" y="491" font-size="22" font-weight="600">Trust the VPS administrator. The two hops are not end-to-end encryption.</text>
    <text x="56" y="528" font-size="21" fill="#50636d">An address or public key is not access. Local programs can reach the open loopback port.</text>
  </g>
</svg>
