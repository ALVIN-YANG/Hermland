name: Download website
on:
  workflow_dispatch:
  # Pages keeps its main-only deployment policy; a release tag is not an allowed source.
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/build-website.sh
      - assets/readme/**
      - ui/Assets.xcassets/ConnectionScene.imageset/connection-scene.png
      - artwork/icons/hermland-icon-messenger-1024.png
      - .github/workflows/pages.yml
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: bash scripts/build-website.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
