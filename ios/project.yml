name: Hermland-iOS
options:
  bundleIdPrefix: land.hermland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HermlandCore:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: SPXQYPSCZ5
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Hermland-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../ui
      - path: Resources
    dependencies:
      - package: HermlandCore
    settings:
      base:
        PRODUCT_NAME: Hermland
        PRODUCT_BUNDLE_IDENTIFIER: land.hermland.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - Hermland-iOSTests
  Hermland-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/App
    dependencies:
      - target: Hermland-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: land.hermland.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hermland.app/Hermland"
        BUNDLE_LOADER: "$(TEST_HOST)"
